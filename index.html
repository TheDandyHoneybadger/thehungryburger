</head>

                        (85) 99999-9999
                    </a>
                </div>
                <img src="images/logo.png" alt="Logo The Hungry Burger" class="logo">
            </div>
            <nav id="category-tabs-container">
                </nav>
        </header>

        <main class="main-container">
            <section id="menu-container">
                <div class="loading-container">
                    <p class="loading">Carregando cardápio...</p>
                </div>
                </section>

            <aside id="cart-container">
                <div class="cart-header">
                    <h2>Meu Carrinho</h2>
                    <button id="close-cart-btn" class="close-btn">&times;</button>
                </div>
                <div id="cart-items">
                    <p class="empty-cart-message">O seu carrinho está vazio.</p>
                </div>
                <div id="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="summary-row">
                        <span>Taxa de Entrega:</span>
                        <span id="delivery-fee">R$ 0,00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">R$ 0,00</span>
                    </div>
                </div>
                <button id="checkout-button" disabled>Finalizar Pedido</button>
            </aside>
        </main>
    </div>

    <button class="mobile-cart-btn" id="mobile-cart-button">
        Ver Carrinho (<span id="mobile-cart-count">0</span>)
    </button>

    <div id="modal-backdrop"></div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-product-name">Nome do Produto</h2>
                <button id="modal-close-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-product-description">Descrição longa e detalhada do produto.</p>
                
                <section id="modal-options-section">
                    <h3>Opções</h3>
                    <div id="modal-options-container">
                        </div>
                </section>
            </div>
            <div class="modal-footer">
                <div class="quantity-control">
                    <button class="quantity-btn" data-action="decrease">-</button>
                    <span id="modal-quantity">1</span>
                    <button class="quantity-btn" data-action="increase">+</button>
                </div>
                <button id="modal-add-to-cart-btn">Adicionar (R$ <span id="modal-total-price">0.00</span>)</button>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Finalizar Pedido</h2>
                <button id="checkout-close-btn" class="close-btn">&times;</button>
            </div>
            <form id="checkout-form" class="modal-body">
                <h3>Tipo de Entrega</h3>
                <div class="delivery-type-group">
                    <label><input type="radio" name="delivery-type" value="delivery" checked> Entrega</label>
                    <label><input type="radio" name="delivery-type" value="pickup"> Retirada</label>
                </div>

                <h3>Seus Dados</h3>
                <div class="form-group">
                    <label for="nome">Nome (Obrigatório)</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label for="telefone">WhatsApp (Obrigatório)</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(XX) 9XXXX-XXXX">
                </div>

                <div id="address-fields">
                    <h3>Endereço</h3>
                    <div class="form-group">
                        <label for="bairro">Bairro (Obrigatório)</label>
                        <select id="bairro" name="bairro" required>
                            <option value="">Carregando bairros...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rua">Rua e Número (Obrigatório)</label>
                        <input type="text" id="rua" name="rua" required placeholder="Ex: Rua das Flores, 123">
                    </div>
                    <div class="form-group">
                        <label for="complemento">Referência (Opcional)</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Ex: Apt 101, próximo à farmácia">
                    </div>
                </div>
                
                <div id="pickup-time-group" style="display: none;">
                    <div class="form-group">
                        <label for="pickup-time">Horário de Retirada (Obrigatório)</label>
                        <input type="time" id="pickup-time" name="pickup-time">
                    </div>
                </div>

                <h3>Pagamento</h3>
                <div class="form-group">
                    <label for="payment-method">Forma de Pagamento</label>
                    <select id="payment-method" name="payment-method" required>
                        <option value="Pix (Pagamento Online)">Pix (Pagamento Online)</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão (Pagamento Online)">Cartão (Pagamento Online)</option>
                        <option value="Cartão (Pagamento Presencial)">Cartão (Pagamento Presencial)</option>
                    </select>
                </div>
                
                <div class="form-group" id="troco-group">
                    <label for="troco">Troco para:</label>
                    <input type="text" id="troco" name="troco" placeholder="Ex: 50,00">
                </div>

                <div class="form-group">
                    <label for="coupon-code">Cupom de Desconto (Opcional)</label>
                    <input type="text" id="coupon-code" name="coupon-code" placeholder="Ex: 10OFF">
                </div>

            </form>
            <div class="modal-footer">
                <button id="confirm-order-btn" class="confirm-btn">Confirmar Pedido</button>
            </div>
        </div>
    </div>

<script src="script.js" charset="UTF-8"></script>

</body>
</html>
